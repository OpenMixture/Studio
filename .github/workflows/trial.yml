name: Exploratory trial deployment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
      pages: read
    env:
      MIXTURE_TEST_BASE: /Studio/
      MIXTURE_BROWSER_ARGS: '["--use-angle=swiftshader","--use-webgpu-adapter=swiftshader"]'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Require successful product checks for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" > "$RUNNER_TEMP/checks.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const checks = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/checks.json")).check_runs;
            for (const name of ["Typecheck and production build", "Chromium WebGPU product contract"]) {
              const latest = checks.filter(c => c.name === name && c.app.slug === "github-actions").sort((a,b) => b.id-a.id)[0];
              if (latest?.conclusion !== "success") throw Error("Required check not successful: " + name);
            }'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run build:trial
      - run: node scripts/verify-deployment.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: trial-deployment-evidence
          path: |
            test-results/
            dist/trial.json
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exploratory trial
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
